media:
  input: assets
  output: /assets
content:
- name: profile
  label: Profile & contact
  type: file
  path: content/profile.json
  format: json
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: title
    label: Title
    type: string
  - name: dept
    label: Department
    type: string
    required: true
  - name: org
    label: Institution
    type: string
    required: true
  - name: photo
    label: Photo
    type: image
  - name: headline
    label: Headline
    type: string
  - name: bio
    label: Bio
    type: text
  - name: email
    label: Email
    type: string
    required: true
  - name: phone
    label: Phone
    type: string
  - name: orcid
    label: Orcid
    type: string
  - name: cv
    label: CV document
    type: file
    required: true
  - name: scholar
    label: Scholar
    type: string
  - name: linkedin
    label: Linkedin
    type: string
  - name: github
    label: Github
    type: string
  - name: personalEmail
    label: Personalemail
    type: string
  - name: logo
    label: Logo
    type: image
    required: true
  - name: footer
    label: Footer
    type: text
- name: news
  label: Home announcements
  type: file
  path: content/news.json
  format: json
  fields:
  - name: heading
    label: Frame heading
    type: string
  - name: intro
    label: Introductory note
    type: text
  - name: items
    label: Items
    type: object
    list:
      collapsible: true
    fields:
    - name: date
      label: Date
      type: string
    - name: title
      label: Title
      type: string
    - name: body
      label: Body
      type: text
    - name: url
      label: Url
      type: string
    - name: visible
      label: Show on homepage
      type: boolean
      default: true
- name: research
  label: Research
  type: file
  path: content/research.json
  format: json
  fields:
  - name: intro
    label: Intro
    type: text
  - name: areas
    label: Areas
    type: object
    list:
      collapsible: true
    fields:
    - name: title
      label: Title
      type: string
    - name: description
      label: Description
      type: text
    - name: notes
      label: Research questions (one per line)
      type: text
- name: publications
  label: Publications
  type: file
  path: content/publications.json
  format: json
  fields:
  - name: intro
    label: Intro
    type: text
  - name: journals
    label: Journals
    type: object
    list:
      collapsible: true
    fields:
    - name: id
      label: Id
      type: string
    - name: title
      label: Title
      type: string
    - name: venue
      label: Venue
      type: string
    - name: meta
      label: Publication / event details
      type: string
    - name: doi
      label: Doi
      type: string
  - name: conferences
    label: Conferences
    type: object
    list:
      collapsible: true
    fields:
    - name: id
      label: Id
      type: string
    - name: title
      label: Title
      type: string
    - name: venue
      label: Venue
      type: string
    - name: meta
      label: Publication / event details
      type: string
    - name: doi
      label: Doi
      type: string
- name: experience
